name: CI

# Typecheck, lint and build on pull requests and feature-branch pushes.
# (Pushes to main run the same checks inside deploy.yml before publishing.)

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Build under a sub-path, as GitHub Pages serves project sites, so
      # base-path regressions fail here rather than after deploying.
      - name: Build
        run: pnpm build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
