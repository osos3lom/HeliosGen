<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>SD-Turbo test</title>
  <style>body { font: 13px system-ui; background: #111; color: #ddd; margin: 20px; } img { width: 256px; margin: 4px; border: 1px solid #333; }</style>
</head>
<body>
  <h3>SD-Turbo isolated test (dev server only)</h3>
  <p>Loads only lib/local/runtime.ts, so editing app components doesn't reload this page mid-download.</p>
  <pre id="log">starting…</pre>
  <div id="out"></div>
  <script type="module">
    const log = document.getElementById("log");
    window.__sd = { done: false, stages: [] };
    const rt = await import("/lib/local/runtime.ts");
    const show = (png) => { const i = new Image(); i.src = URL.createObjectURL(png); document.getElementById("out").append(i); };
    const t0 = performance.now();
    try {
      const r = await rt.runSdTurbo({
        prompt: "a photo of a red apple on a wooden table, studio lighting",
        seed: 42,
        onProgress: (p) => {
          window.__sd.last = p;
          if (!window.__sd.stages.includes(p.stage)) window.__sd.stages.push(p.stage);
          log.textContent = `${p.stage} ${p.fraction !== undefined ? Math.round(p.fraction * 100) + "%" : ""}`;
        },
      });
      window.__sd.totalMs = Math.round(performance.now() - t0);
      window.__sd.genMs = r.ms;
      show(r.png);
      const bmp = await createImageBitmap(r.png);
      const oc = new OffscreenCanvas(bmp.width, bmp.height); const og = oc.getContext("2d"); og.drawImage(bmp, 0, 0);
      const d = og.getImageData(0, 0, bmp.width, bmp.height).data; const n = d.length / 4; const sum = [0, 0, 0]; let sq = 0;
      for (let i = 0; i < d.length; i += 4) { sum[0] += d[i]; sum[1] += d[i + 1]; sum[2] += d[i + 2]; sq += d[i] * d[i]; }
      const meanR = sum[0] / n;
      window.__sd.stats = { size: [bmp.width, bmp.height], mean: sum.map((v) => Math.round(v / n)), stdR: Math.round(Math.sqrt(sq / n - meanR * meanR)) };
      const t1 = performance.now();
      const r2 = await rt.runSdTurbo({ prompt: "a lighthouse on a cliff at sunset, dramatic sky", seed: 7 });
      window.__sd.warmMs = Math.round(performance.now() - t1);
      show(r2.png);
      log.textContent = "done";
    } catch (e) {
      window.__sd.err = String(e);
      log.textContent = "error: " + e;
    }
    window.__sd.done = true;
  </script>
</body>
</html>
